apiVersion: v1
kind: Namespace
metadata:
  name: number-reverser
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: number-reverser
  namespace: number-reverser
  labels:
    app: number-reverser
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: number-reverser
  template:
    metadata:
      labels:
        app: number-reverser
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: number-reverser
          image: number-reverser:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: number-reverser
  namespace: number-reverser
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
  selector:
    app: number-reverser
